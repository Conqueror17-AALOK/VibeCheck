<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Nav Bar Test Sample</title>
  <style>
    body { font-family: sans-serif; margin: 0; background: #ffffff; }
    .navbar { display: flex; align-items: center; justify-content: space-between; padding: 16px 32px; background: #1e293b; color: #ffffff; }
    .nav-brand { font-size: 20px; font-weight: bold; color: #38bdf8; text-decoration: none; }
    .nav-links { display: flex; gap: 24px; list-style: none; margin: 0; padding: 0; }
    .nav-link { color: #f8fafc; text-decoration: none; font-size: 15px; }
    .nav-link:hover { color: #38bdf8; }
    .search-bar { padding: 6px 12px; border-radius: 4px; border: 1px solid #475569; background: #0f172a; color: #ffffff; }
    .btn-cta { padding: 8px 16px; background: #0284c7; color: #ffffff; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; }
  </style>
</head>
<body>
  <nav class="navbar" role="navigation">
    <a href="#" class="nav-brand">VibeCheck App</a>
    <ul class="nav-links">
      <li><a href="#features" class="nav-link">Features</a></li>
      <li><a href="#pricing" class="nav-link">Pricing</a></li>
      <li><a href="#docs" class="nav-link">Documentation</a></li>
    </ul>
    <div style="display: flex; gap: 12px; align-items: center;">
      <input type="text" class="search-bar" placeholder="Search docs..." />
      <button class="btn-cta">Get Started</button>
    </div>
  </nav>
</body>
</html>
