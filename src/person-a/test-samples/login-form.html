<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login Form Test Sample</title>
  <style>
    body { font-family: sans-serif; background-color: #f4f4f9; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
    .login-card { background: #ffffff; padding: 24px; border-radius: 8px; width: 320px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    h2 { font-size: 20px; color: #333333; margin-top: 0; }
    label { display: block; margin-bottom: 6px; font-size: 14px; color: #666666; }
    input[type="email"], input[type="password"] { width: 100%; padding: 10px; margin-bottom: 16px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
    .btn-submit { width: 100%; padding: 12px; background-color: #0066ff; color: #ffffff; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; }
    .hidden-msg { display: none; }
    .secret-note { visibility: hidden; }
  </style>
</head>
<body>
  <div class="login-card" role="form">
    <h2>Account Login</h2>
    <form>
      <label for="email">Email Address</label>
      <input type="email" id="email" name="email" placeholder="you@example.com" required />

      <label for="password">Password</label>
      <input type="password" id="password" name="password" placeholder="••••••••" required />

      <button type="submit" class="btn-submit">Sign In</button>
    </form>
    <div class="hidden-msg">You should not see this because display is none</div>
    <div class="secret-note">This is hidden visibility</div>
  </div>
</body>
</html>
