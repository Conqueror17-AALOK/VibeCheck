<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Card Grid Test Sample</title>
  <style>
    body { font-family: sans-serif; background: #fafafa; padding: 40px; margin: 0; }
    .card-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
    .product-card { background: #ffffff; border: 1px solid #e0e0e0; border-radius: 8px; padding: 20px; }
    .product-card img { width: 100%; height: 120px; object-fit: cover; border-radius: 4px; }
    .product-title { font-size: 18px; margin: 12px 0 8px; color: #111111; }
    .product-price { font-size: 16px; font-weight: bold; color: #2e7d32; }
    .chip-badge { display: inline-block; padding: 4px 8px; background: #e3f2fd; color: #1565c0; border-radius: 12px; font-size: 12px; }
    .btn-buy { margin-top: 12px; padding: 8px 16px; background: #ff9800; color: #ffffff; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; }
  </style>
</head>
<body>
  <div class="card-grid">
    <div class="product-card" role="article">
      <img src="https://via.placeholder.com/150" alt="Product 1" />
      <span class="chip-badge">New Arrival</span>
      <h3 class="product-title">Wireless Headphones</h3>
      <div class="product-price">$99.99</div>
      <button class="btn-buy">Add to Cart</button>
    </div>
    <div class="product-card" role="article">
      <img src="https://via.placeholder.com/150" alt="Product 2" />
      <span class="chip-badge">Best Seller</span>
      <h3 class="product-title">Smart Watch v2</h3>
      <div class="product-price">$149.99</div>
      <button class="btn-buy">Add to Cart</button>
    </div>
    <div class="product-card" role="article">
      <img src="https://via.placeholder.com/150" alt="Product 3" />
      <span class="chip-badge">Sale</span>
      <h3 class="product-title">Mechanical Keyboard</h3>
      <div class="product-price">$79.99</div>
      <button class="btn-buy">Add to Cart</button>
    </div>
  </div>
</body>
</html>
